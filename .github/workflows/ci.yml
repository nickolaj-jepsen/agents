name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run on a branch by hand. `update-deps-hash.yml` starts one on the commit it pushes, which a
  # push made with the workflow's own token would not.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The required check: `pnpm turbo run check` runs the same thing locally.
  check:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The remote cache is Vercel's. A run without the token (a fork, or Dependabot until its own
      # secrets are set) runs every task, as turbo does with no remote cache configured.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      # CI writes the cache; a local run only reads it (`.envrc`).
      TURBO_CACHE: local:rw,remote:rw
      # A 4-core runner: Claude Code starts less reliably when sessions crowd it.
      E2E_JOBS_CLAUDE: 1
      E2E_JOBS_PI: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version is `packageManager`'s.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Python from `.python-version`, fetched once, before turbo starts several uv tasks at once.
      - run: uv python install
      - run: pnpm install --frozen-lockfile
      # Two tasks at a time: the e2e packages each run their own pool of sessions.
      - name: Check
        run: pnpm turbo run check --concurrency=2
      # `check:nix` is the one check that needs nix. Ask turbo whether its result is cached, and
      # install nix only when it is not: it keys on the nix files and `flake.lock` alone.
      - name: Does the nix check need to run
        id: nix
        run: |
          status=$(pnpm turbo run check:nix --dry=json | jq -r '.tasks[] | select(.taskId == "//#check:nix") | .cache.status')
          echo "check:nix is ${status:-unknown}"
          if [ "$status" = HIT ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.nix.outputs.run == 'true'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # Pulls what earlier runs built and pushes what this one builds; read-only without the token,
      # as on a Dependabot PR.
      - if: steps.nix.outputs.run == 'true' && vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - if: steps.nix.outputs.run == 'true'
        name: Check the nix files
        run: pnpm turbo run check:nix
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      # A mismatch writes `.actual.snap` and `.actual.png` beside the snapshot; failed steps leave
      # `*.actual.png`.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-actual
          path: |
            apps/*/src/e2e/__snapshots__/**/*.actual.*
            lib/kits/*/e2e/__snapshots__/**/*.actual.*
          if-no-files-found: ignore

  # The plugins as the marketplace installs them: built by nix (`nix build .#plugins`) from the commit
  # the gate passed on, appended to the `dist` branch as one commit per publish (see
  # .github/publish-dist.sh). Nothing else holds a write token.
  publish:
    name: Publish plugins
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # One publish at a time, in push order: a newer one waits rather than cancelling one in flight.
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the plugins
        run: nix build .#plugins --print-build-logs --out-link plugins
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      - name: Commit them to dist
        run: .github/publish-dist.sh plugins
        env:
          DIST_REMOTE: ${{ github.server_url }}/${{ github.repository }}
          DIST_TOKEN: ${{ github.token }}
          DIST_SOURCE: ${{ github.sha }}
