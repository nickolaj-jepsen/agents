name: Pages

# The site (site/) on GitHub Pages: its media recorded (no sign-in, no model), built, deployed from main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "plugins/**"
      - "skills/**"
      - "docs/**"
      - "kit/**"
      - "e2e/**"
      - "scripts/**"
      - "flake.lock"
      - "devshell.nix"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# One deploy at a time; a newer push waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The media replay from the e2e scenarios on a stubbed model, so the same inputs give the same
      # pictures: cache on them.
      - id: media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site/media
            kit/catalog/catalog.json
          key: media-${{ hashFiles('e2e/**', 'plugins/**', 'kit/**', 'flake.lock', 'devshell.nix', 'package-lock.json') }}
      - if: steps.media.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # E2E_UPDATE: the kit's snapshots gate local runs, not the site; a newer Claude Code that draws
      # a story differently still gets its picture.
      - if: steps.media.outputs.cache-hit != 'true'
        name: Record the media
        run: nix develop .#media --command just _media
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
          E2E_UPDATE: "1"
          E2E_JOBS: "2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # The root's packages are what scripts/content.ts imports (yaml); none needs its install scripts.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
