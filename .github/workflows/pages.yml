name: Pages

# The site (site/) on GitHub Pages: its media recorded (no sign-in, no model), built, deployed from main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "plugins/**"
      - "skills/**"
      - "docs/**"
      - "kit/**"
      - "e2e/**"
      - "scripts/**"
      - "flake.lock"
      - "flake.nix"
      - "packages.nix"
      - "devshell.nix"
      - "pkgs/**"
      - "justfile"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# One deploy at a time; a newer push waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # Pulls the recordings Nix has already made, and pushes new ones; read-only without the token.
      - if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # `.#site-media` and `.#site-kit` record on a stubbed model in a config folder of their own, so
      # the same inputs give the same pictures. A derivation's path is a hash of every input it
      # reads (files, agents, fonts, tools), so the two paths are the exact cache key: an edit
      # that reaches neither (a doc, the workflow) still hits.
      - id: key
        run: echo "media=media-$(nix path-info --derivation .#site-media .#site-kit | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      # The recordings as files, for when no binary cache is configured: a runner starts with an
      # empty store.
      - id: media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site/media
            site/data/kit.json
          key: ${{ steps.key.outputs.media }}
      - if: steps.media.outputs.cache-hit != 'true'
        name: Record the media
        run: nix shell --inputs-from . nixpkgs#just --command just media
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # The root's packages are what scripts/content.ts imports (yaml); none needs its install scripts.
      - run: npm ci --ignore-scripts
      # The content model, from this checkout's markdown: cheap, and never stale in a cache.
      - run: npm run site-data
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
