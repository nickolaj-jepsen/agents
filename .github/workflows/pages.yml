name: Pages

# The site (apps/site/) on GitHub Pages: its media recorded (no sign-in, no model), built, deployed from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time; a newer push waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Turbo's remote cache keeps the recordings: a task whose inputs did not change is restored,
      # not replayed, so a push that touches no scenario, plugin or tool records nothing.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_CACHE: local:rw,remote:rw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Turbo runs the recorders through `nix run .#media`, which holds VS Code, the fonts and the tools they call.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # Pulls the environment's tools; read-only without the token.
      - if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The pnpm version is `packageManager`'s.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # cage, VS Code's display, puts its socket in the runtime folder: give it one of its own.
      - name: A runtime folder for cage
        run: |
          dir=$(mktemp -d)
          chmod 700 "$dir"
          echo "XDG_RUNTIME_DIR=$dir" >> "$GITHUB_ENV"
      # One `media` task per app and kit package (and `media:vscode` per app with VS Code pictures): a
      # package whose scenarios, build or imports did not change is restored from the cache. Three at
      # once: a recorder waits more than it computes (two at once keep one core busy), but a VS Code
      # panel draws no pictures when its timers are starved, so the runner's four cores are not filled.
      - name: Record the media
        run: pnpm turbo run media --concurrency=3
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      # Reads what the recordings left under apps/site/, so it runs after them.
      - run: pnpm turbo run @agents/site#build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
