# One PR a day at most, all flake inputs together; the Dependabot auto-merge workflow merges it once
# `CI gate` passes. Dependabot's 3-day cooldown on an input's new commits still applies.
version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      # `daily` skips weekends; a cron expression doesn't.
      interval: "cron"
      cronjob: "23 3 * * *"
    open-pull-requests-limit: 1
    groups:
      flake-inputs:
        patterns: ["*"]
