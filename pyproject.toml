# uv workspace root for the skills' Python; turbo reads [tool.turbo].
[project]
# Not the [tool.turbo] name: turbo rejects a workspace named like the root project.
name = "agents-uv-root"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["skills/run-handoff/scripts", "lib/tools/updates/python"]

[tool.turbo]
name = "agents-python"

[tool.ruff]
# Ruff 0.17 formats Markdown too; oxfmt owns that.
include = ["*.py"]
extend-exclude = [".agents", "skills/mermaid/scripts/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510", "EXE"]
