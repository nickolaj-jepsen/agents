packages:
  - apps/*
  - lib/kits/*
  - lib/tools/*
allowBuilds:
  "@anthropic-ai/claude-code": true
  "@google/genai": false
  esbuild: true
  koffi: false
  protobufjs: false
# Each package installs what it uses, so bumping a tool changes only the tasks of the packages that
# have it: turbo hashes the root's dependencies into every task, and a root that held them all would
# rerun the whole suite on every Dependabot bump. That is why the root holds turbo alone and the
# linters live in lib/tools/lint/. The catalog states each shared version once; Dependabot updates it here.
catalog:
  # Held at 2.1.325, which the e2e snapshots were recorded on: 2.1.327 draws answer/table-code, docfix
  # applied and dismissed and linear-issue at 70x24 differently. Re-record on it, then bump.
  "@anthropic-ai/claude-code": 2.1.325
  "@earendil-works/pi-agent-core": 1.5.2
  "@earendil-works/pi-ai": 1.5.2
  "@earendil-works/pi-coding-agent": 1.5.2
  "@earendil-works/pi-tui": 1.5.2
  "@microsoft/tui-test": ^0.1.1
  "@types/node": ^26.6.6
  chokidar: 5.0.0
  commander: 15.1.0
  playwright-core: 1.65.1
  tsdown: ^0.23.7
  typebox: 1.4.7
  typescript: ^7.0.2
  vitest: ^5.1.1
  yaml: ^2.9.1
  zod: ^4.6.7
# A plugin's peerDependencies name the packages pi supplies and stay "*"; its devDependencies pin the
# one copy it is checked against. autoInstallPeers would add a second, unpinned copy of each peer.
autoInstallPeers: false
